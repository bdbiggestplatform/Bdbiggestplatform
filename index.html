<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Access | 18+ Members</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #090307;
            overflow: hidden;
        }
        /* ব্যাকগ্রাউন্ডে অ্যাডাল্ট/প্রাইভেট ক্লাব ভাইবের জন্য সফট ব্লার ও ডার্ক গ্লো */
        .bg-ambient {
            background-image: 
                radial-gradient(circle at 20% 25%, rgba(225, 29, 72, 0.35), transparent 45%),
                radial-gradient(circle at 80% 75%, rgba(190, 24, 93, 0.30), transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(88, 28, 135, 0.25), transparent 60%),
                url('https://images.unsplash.com/photo-1519671482749-fd09be7ccebf?auto=format&fit=crop&w=1600&q=80');
            background-size: cover;
            background-position: center;
            filter: blur(18px) brightness(0.38) contrast(1.2);
            transform: scale(1.1);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center relative select-none">

    <!-- Blurred Background Layer -->
    <div class="fixed inset-0 bg-ambient -z-20"></div>
    <div class="fixed inset-0 bg-gradient-to-b from-black/60 via-rose-950/30 to-black/80 -z-10"></div>

    <!-- Center Login Button Only -->
    <a href="#"
       class="px-14 py-4 rounded-full bg-gradient-to-r from-rose-600 via-pink-600 to-rose-700 text-white font-bold text-lg tracking-wider uppercase shadow-[0_0_40px_rgba(225,29,72,0.65)] border border-rose-400/40 hover:scale-105 hover:shadow-[0_0_55px_rgba(244,63,94,0.85)] active:scale-95 transition-all duration-300">
        Login
    </a>

</body>
</html>

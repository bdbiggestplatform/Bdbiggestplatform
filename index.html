<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>18+ VIP Access | Member Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #090206;
        }
        .font-display {
            font-family: 'Playfair Display', serif;
        }
        .bg-ambient {
            background-image:
                radial-gradient(circle at 18% 20%, rgba(225, 29, 72, 0.32), transparent 45%),
                radial-gradient(circle at 82% 80%, rgba(190, 24, 93, 0.28), transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(88, 28, 135, 0.22), transparent 60%),
                url('https://images.unsplash.com/photo-1519671482749-fd09be7ccebf?auto=format&fit=crop&w=1600&q=80');
            background-size: cover;
            background-position: center;
            filter: blur(20px) brightness(0.32) contrast(1.2);
            transform: scale(1.08);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between text-white relative overflow-x-hidden">

    <!-- Blurred Background Layer -->
    <div class="fixed inset-0 bg-ambient -z-20"></div>
    <div class="fixed inset-0 bg-gradient-to-b from-black/75 via-rose-950/25 to-black/85 -z-10"></div>

    <!-- 18+ Styled Header -->
    <header class="w-full border-b border-rose-500/20 bg-black/50 backdrop-blur-md">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2.5">
                <span class="px-2.5 py-1 rounded-md bg-rose-600 text-white text-xs font-extrabold tracking-wider shadow-[0_0_15px_rgba(225,29,72,0.7)]">
                    18+
                </span>
                <span class="font-display text-lg sm:text-xl font-bold tracking-wide text-white">
                    VELVET<span class="text-rose-500 italic">CLUB</span>
                </span>
            </div>

            <div class="flex items-center gap-2 text-xs text-rose-300/90 bg-rose-950/50 border border-rose-500/30 px-3 py-1.5 rounded-full">
                <i class="fa-solid fa-lock text-rose-400"></i>
                <span>Adults Only • Private Portal</span>
            </div>
        </div>
    </header>

    <!-- Main Center Login Box -->
    <main class="flex-grow flex items-center justify-center px-4 py-10">
        <div class="w-full max-w-md bg-zinc-950/80 backdrop-blur-xl border border-rose-500/30 rounded-3xl p-7 sm:p-9 shadow-[0_0_50px_rgba(225,29,72,0.22)]">
            
            <div class="text-center mb-7">
                <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-rose-600/20 border border-rose-500/40 text-rose-400 text-xl mb-3 shadow-[0_0_20px_rgba(225,29,72,0.35)]">
                    <i class="fa-solid fa-fire-flame-curved"></i>
                </div>
                <h1 class="font-display text-2xl sm:text-3xl font-bold text-white">VIP Member Login</h1>
                <p class="text-xs text-zinc-400 mt-1.5">Enter your Member ID and Password to continue</p>
            </div>

            <form id="vipLoginForm" onsubmit="handleVipLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-rose-300/90 mb-1.5">
                        Member ID
                    </label>
                    <div class="relative">
                        <i class="fa-solid fa-user absolute left-4 top-1/2 -translate-y-1/2 text-zinc-500 text-sm"></i>
                        <input type="text" id="memberId" required placeholder="Enter your ID"
                               class="w-full pl-11 pr-4 py-3.5 text-sm bg-black/70 border border-zinc-800 rounded-xl text-white placeholder-zinc-500 focus:outline-none focus:border-rose-500 transition">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-rose-300/90 mb-1.5">
                        Password
                    </label>
                    <div class="relative">
                        <i class="fa-solid fa-key absolute left-4 top-1/2 -translate-y-1/2 text-zinc-500 text-sm"></i>
                        <input type="password" id="memberPass" required placeholder="••••••••"
                               class="w-full pl-11 pr-11 py-3.5 text-sm bg-black/70 border border-zinc-800 rounded-xl text-white placeholder-zinc-500 focus:outline-none focus:border-rose-500 transition">
                        <button type="button" onclick="togglePass()" class="absolute right-4 top-1/2 -translate-y-1/2 text-zinc-500 hover:text-rose-400 text-sm">
                            <i id="eyeIcon" class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div id="loginMsg" class="hidden text-xs text-center py-2.5 px-3 rounded-xl"></div>

                <button type="submit" id="loginBtn"
                        class="w-full py-3.5 mt-2 rounded-xl bg-gradient-to-r from-rose-600 via-pink-600 to-rose-700 text-white font-bold text-sm tracking-wider uppercase shadow-[0_0_30px_rgba(225,29,72,0.5)] hover:shadow-[0_0_45px_rgba(244,63,94,0.8)] active:scale-98 transition-all">
                    <i class="fa-solid fa-right-to-bracket mr-2"></i> Login Now
                </button>
            </form>

        </div>
    </main>

    <!-- 18+ Styled Footer -->
    <footer class="w-full border-t border-rose-500/20 bg-black/60 backdrop-blur-md py-4 px-4">
        <div class="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2 text-[11px] text-zinc-400 text-center">
            <div class="flex items-center gap-2">
                <span class="px-2 py-0.5 rounded bg-rose-950 border border-rose-500/40 text-rose-400 font-bold">18+ RESTRICTED</span>
                <span>Strict Age Verification Policy • Adults Only</span>
            </div>
            <p>&copy; 2026 VelvetClub Private Network. All Rights Reserved.</p>
        </div>
    </footer>

    <script>
        // পাসওয়ার্ড দেখা/লুকানোর ফাংশন
        function togglePass() {
            const input = document.getElementById('memberPass');
            const icon = document.getElementById('eyeIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        // লগইন হ্যান্ডলার
        function handleVipLogin(event) {
            event.preventDefault();
            const id = document.getElementById('memberId').value.trim();
            const pass = document.getElementById('memberPass').value.trim();
            const msg = document.getElementById('loginMsg');
            const btn = document.getElementById('loginBtn');

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Verifying...';

            // এখানে আপনার নির্দিষ্ট আইডি ও পাসওয়ার্ড সেট করতে পারেন
            const VALID_ID = "vip18";
            const VALID_PASS = "123456";

            setTimeout(() => {
                if (id === VALID_ID && pass === VALID_PASS) {
                    msg.className = "text-xs text-center py-2.5 px-3 rounded-xl bg-emerald-950/70 border border-emerald-500/40 text-emerald-300 block";
                    msg.innerHTML = '<i class="fa-solid fa-circle-check mr-1"></i> Access Granted! Redirecting...';
                    // সফল হলে যে লিংকে পাঠাতে চান সেটি নিচে বসাবেন:
                    // window.location.href = "https://your-destination-link.com";
                } else {
                    msg.className = "text-xs text-center py-2.5 px-3 rounded-xl bg-rose-950/80 border border-rose-500/40 text-rose-300 block";
                    msg.innerHTML = '<i class="fa-solid fa-circle-exclamation mr-1"></i> Invalid Member ID or Password.';
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa-solid fa-right-to-bracket mr-2"></i> Login Now';
                }
            }, 700);
        }
    </script>
</body>
</html>

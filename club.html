<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KINKWERK BERLIN | FSK 18+ Private Entry</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: #050507;
        }
        .font-brand {
            font-family: 'Syne', sans-serif;
        }
        .berlin-bg {
            background-image:
                linear-gradient(135deg, rgba(5, 5, 7, 0.92) 0%, rgba(24, 10, 46, 0.78) 50%, rgba(5, 5, 7, 0.95) 100%),
                url('https://images.unsplash.com/photo-1566737236500-c8ac43014a67?auto=format&fit=crop&w=1600&q=80');
            background-size: cover;
            background-position: center;
        }
        .neon-grid {
            background-image: linear-gradient(to right, rgba(139, 92, 246, 0.07) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(139, 92, 246, 0.07) 1px, transparent 1px);
            background-size: 36px 36px;
        }
    </style>
</head>
<body class="berlin-bg min-h-screen flex flex-col justify-between text-zinc-100 relative overflow-x-hidden">

    <!-- Subtle Cyber Grid Overlay -->
    <div class="fixed inset-0 neon-grid pointer-events-none -z-10"></div>

    <!-- European / Berlin 18+ Header -->
    <header class="w-full border-b border-violet-500/20 bg-black/70 backdrop-blur-md">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="flex items-center justify-center px-2.5 py-1 bg-amber-500 text-black font-extrabold text-xs tracking-tighter">
                    FSK 18
                </div>
                <span class="font-brand text-lg sm:text-xl font-extrabold tracking-widest uppercase text-white">
                    KINK<span class="text-violet-400">WERK</span>
                </span>
                <span class="hidden md:inline-block text-[10px] font-semibold uppercase tracking-[0.25em] text-zinc-400 border-l border-zinc-700 pl-3">
                    Berlin • Private Studio
                </span>
            </div>

            <div class="flex items-center gap-2.5 text-[11px] font-semibold uppercase tracking-wider text-amber-300 bg-amber-500/10 border border-amber-500/30 px-3 py-1">
                <i class="fa-solid fa-shield-halved text-amber-400"></i>
                <span>EU 18+ Restricted</span>
            </div>
        </div>
    </header>

    <!-- Main Login Panel -->
    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="w-full max-w-md bg-[#0b0a10]/90 border border-violet-500/30 shadow-[0_0_70px_rgba(124,58,237,0.22)] relative">
            
            <!-- Top Accent Bar -->
            <div class="h-1.5 w-full bg-gradient-to-r from-violet-600 via-fuchsia-500 to-amber-500"></div>

            <div class="p-7 sm:p-10">
                <div class="flex items-center justify-between mb-6 pb-4 border-b border-zinc-800/90">
                    <div>
                        <p class="text-[11px] uppercase tracking-[0.25em] text-violet-400 font-semibold">
                            Underground Vault • DE
                        </p>
                        <h1 class="font-brand text-2xl sm:text-3xl font-extrabold text-white mt-1">
                            MEMBER ENTRY
                        </h1>
                    </div>
                    <div class="w-11 h-11 border border-amber-500/40 bg-amber-500/10 flex items-center justify-center text-amber-400 text-sm font-bold">
                        18+
                    </div>
                </div>

                <form id="kwLoginForm" onsubmit="handleKwLogin(event)" class="space-y-5">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-widest text-zinc-400 mb-2">
                            Member ID
                        </label>
                        <div class="relative">
                            <i class="fa-solid fa-terminal absolute left-4 top-1/2 -translate-y-1/2 text-violet-400 text-xs"></i>
                            <input type="text" id="kwId" required placeholder="e.g. KW-DE-18"
                                   class="w-full pl-11 pr-4 py-3.5 text-sm bg-[#050507] border border-zinc-800 text-white placeholder-zinc-600 focus:outline-none focus:border-violet-500 transition">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-widest text-zinc-400 mb-2">
                            Access Password
                        </label>
                        <div class="relative">
                            <i class="fa-solid fa-key absolute left-4 top-1/2 -translate-y-1/2 text-violet-400 text-xs"></i>
                            <input type="password" id="kwPass" required placeholder="••••••••••"
                                   class="w-full pl-11 pr-11 py-3.5 text-sm bg-[#050507] border border-zinc-800 text-white placeholder-zinc-600 focus:outline-none focus:border-violet-500 transition">
                            <button type="button" onclick="toggleKwPass()" class="absolute right-4 top-1/2 -translate-y-1/2 text-zinc-500 hover:text-amber-400 text-sm">
                                <i id="kwEye" class="fa-solid fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div id="kwMsg" class="hidden text-xs py-2.5 px-3 border"></div>

                    <button type="submit" id="kwBtn"
                            class="w-full py-4 mt-2 bg-gradient-to-r from-violet-600 to-fuchsia-600 hover:from-violet-500 hover:to-fuchsia-500 text-white font-bold text-sm uppercase tracking-[0.2em] shadow-[0_0_30px_rgba(124,58,237,0.45)] transition-all">
                        Enter Portal <i class="fa-solid fa-arrow-right ml-2"></i>
                    </button>
                </form>
            </div>
        </div>
    </main>

    <!-- European 18+ Footer -->
    <footer class="w-full border-t border-violet-500/20 bg-black/80 backdrop-blur-md py-4 px-4">
        <div class="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2 text-[11px] text-zinc-400 text-center">
            <div class="flex items-center gap-2">
                <span class="px-2 py-0.5 bg-amber-500/15 border border-amber-500/40 text-amber-400 font-bold tracking-wider">
                    FSK 18 • JUSCHG §14
                </span>
                <span>Strict Adult Age Verification • Berlin, Germany</span>
            </div>
            <p>&copy; 2026 KINKWERK.DE Media GmbH. All Rights Reserved.</p>
        </div>
    </footer>

    <script>
        function toggleKwPass() {
            const input = document.getElementById('kwPass');
            const icon = document.getElementById('kwEye');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        function handleKwLogin(event) {
            event.preventDefault();
            const id = document.getElementById('kwId').value.trim();
            const pass = document.getElementById('kwPass').value.trim();
            const msg = document.getElementById('kwMsg');
            const btn = document.getElementById('kwBtn');

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Authenticating...';

            // নিজের ইচ্ছেমতো ID ও Password এখানে সেট করুন
            const VALID_ID = "KW-DE-18";
            const VALID_PASS = "berlin18";

            setTimeout(() => {
                if (id === VALID_ID && pass === VALID_PASS) {
                    msg.className = "text-xs py-2.5 px-3 border border-emerald-500/40 bg-emerald-950/60 text-emerald-300 block";
                    msg.innerHTML = '<i class="fa-solid fa-check mr-1"></i> Access Granted. Opening Berlin Vault...';
                    // সফল হলে যে লিংকে পাঠাতে চান সেটি নিচে দিন:
                    // window.location.href = "https://your-destination-url.com";
                } else {
                    msg.className = "text-xs py-2.5 px-3 border border-amber-500/40 bg-amber-950/50 text-amber-300 block";
                    msg.innerHTML = '<i class="fa-solid fa-triangle-exclamation mr-1"></i> Access Denied: Invalid ID or Password.';
                    btn.disabled = false;
                    btn.innerHTML = 'Enter Portal <i class="fa-solid fa-arrow-right ml-2"></i>';
                }
            }, 650);
        }
    </script>
</body>
</html>
